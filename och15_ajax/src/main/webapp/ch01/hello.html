<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<script type="text/javascript" src="../js/httpRequest.js"></script>
<script type="text/javascript">
	function chk() {
		
		var params = "name=" + encodeURIComponent(frm.name.value);
		// hello를 실행시킨다 -> (url, 파라메터, call back함수(성공적실행), 방법)
		sendRequest("hello.jsp", params, result, "post");
	}

	function result() {
		if (httpRequest.readyState == 4) // 서버 응답이 완료되면 4
			if (httpRequest.status == 200) { // 정상적으로 응답을 받은 경우 200
				var text1 = httpRequest.responseText;
				alert("responseText"+ text1); // 응답해오는 값
				start = text1.indexOf("<body>");
				end = text1.indexOf("</body>");
				var text2 = text1.substring(start + 6, end);
				alert(text2);
			} else
				alert("Sever 오류");
	}
</script>
<body>
	<h2>이름을 입력하세용</h2>
	<form action="" name="frm">
		<input type="text" name="name"> 
		<input type="button"value="확인" onclick="chk()">
	</form>
</body>
</html>
