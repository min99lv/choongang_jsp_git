<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<script type="text/javascript">
	function chk() {
		// 태그 객체를 말함 값을 말하는 것이 아님
		var idName = document.getElementById("idName");
		var idAddr = document.getElementById("idAddr");
		// 객체 이므로 .value를 사용한 것
		if(!idName.value){
			alert("이름을 입력하시오");
			idName.focus();
			return false;
		}
		if(!idAddr.value){
			alert("이름을 입력하시오");
			idAddr.focus();
			return false;
		}
		return true;
		
	}

</script>
<body>
	<h2>이름과 주소를 입력하세요</h2>
<!-- 	<form action="forward.jsp" onsubmit="return chk()"> -->
	<form action="forward2.jsp" onsubmit="return chk()">
		이름 : <input type="text" name="name" id="idName"><p>
		주소 : <input type="text" name="addr" id="idName"><p>
		<input type="submit" value="확인">
	</form>
</body>
</html>
