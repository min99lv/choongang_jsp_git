<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script type="text/javascript"
	src="http://code.jquery.com/jquery-latest.min.js"></script>
<script type="text/javascript">
	$(function() {
		// .eq() td 기준으로 배열의 인덱스처럼 적용
		$('td').eq(0).css('background', 'yellow');
		$('td').eq(3).css('background', 'orange');
		$('td').eq(-2).css('background', 'pink'); /* 맨 뒤에서 부터 두번째  */
		$('td').eq(-4).css('background', 'cyan'); /* 맨 뒤에서 부터 네번째  */
		$('td').last().css('background', 'blue'); /* 맨 마지막  */
	});
</script>
</head>
<body>
	<table border="1">
		<tr>
			<td>1구슬</td>
			<td>2구슬</td>
		</tr>
		<tr>
			<td>3구슬</td>
			<td>4구슬</td>
		</tr>
		<tr>
			<td>5구슬</td>
			<td>6구슬</td>
		</tr>
	</table>
</body>
</html>
